<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 가장 기본적인 HTML 리디렉트: 0초 대기 후 해당 URL로 이동 -->
    <meta http-equiv="refresh" content="0; url=https://umfworldwide.com/">
    
    <title>Ultra Music Festival로 이동 중...</title>

    <!-- 자바스크립트를 이용한 리디렉트 (메타 태그가 작동하지 않는 환경 대비) -->
    <script>
        window.location.href = "https://umfworldwide.com/";
    </script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px; font-family: sans-serif;">
        <p>자동으로 Ultra Music Festival 웹사이트로 이동합니다.</p>
        <p>3초 이상 화면이 멈춰있다면 아래 링크를 클릭해주세요.</p>
        <a href="https://umfworldwide.com/" style="color: #0056b3; text-decoration: underline;">
            https://umfworldwide.com/ 바로가기
        </a>
    </div>
</body>
</html>
